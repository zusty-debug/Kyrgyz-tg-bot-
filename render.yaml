# Render Blueprint for the Telegram bot service.
# All secret env vars are marked sync:false so the operator (you) pastes them
# in the Render dashboard after the service is created.
#
# Render docker-runtime web services do NOT accept startCommand — the
# container's behavior is controlled entirely by the Dockerfile's
# CMD/ENTRYPOINT directives. Our Dockerfile already CMDs
# `bash /app/scripts/start.sh` which starts the HTTP healthcheck server
# in the background and the bot polling loop in the foreground.

services:
  - type: web
    name: kyrgyz-tg-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Postgres connection string — paste from kyrgyz-data-db on Render
      # (Internal Connection String, since both services live in the same
      # account).
      - key: DATABASE_URL
        sync: false
      # Public URL of the FastAPI service created from the OTHER repo.
      - key: API_URL
        value: https://kyrgyz-data-api.onrender.com
      # Search-only API key (created via the /admin UI in the API repo).
      - key: API_KEY
        sync: false
      # Telegram bot credentials
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      # Cosmetic + behavior
      - key: DEV_HANDLE
        value: "@xzusty"
      - key: DAILY_QUOTA
        value: 5
      - key: PER_PAGE
        value: 5
